<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Gallery</title>
  <style>
    body {
      margin: 0;
      background: white;
      font-family: sans-serif;
    }

    .gallery-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      margin-top: 30px;
    }

    .main-image-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 50%;
    }

    .main-image {
      width: 100%;
      max-height: 600px;
      object-fit: contain;
      border-radius: 10px;
    }

    .nav-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      font-size: 32px;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      z-index: 2;
      border-radius: 5px;
    }

    .nav-button.left {
      left: -60px;
    }

    .nav-button.right {
      right: -60px;
    }

    .thumbnail-strip {
      display: flex;
      overflow-x: auto;
      margin-top: 20px;
      padding: 10px;
      width: 90%;
      gap: 10px;
    }

    .thumbnail-strip img {
      height: 80px;
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 5px;
      transition: border 0.2s;
    }

    .thumbnail-strip img.active {
      border: 2px solid #007bff;
    }

    /* Scrollbar styling (optional) */
    .thumbnail-strip::-webkit-scrollbar {
      height: 8px;
    }

    .thumbnail-strip::-webkit-scrollbar-thumb {
      background: #aaa;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div class="gallery-wrapper">
  <div class="main-image-container">
    <button class="nav-button left" onclick="prevImage()">&#10094;</button>
    <img id="mainImage" class="main-image" src="assets/images/IMG_5391.PNG" alt="Gallery Image">
    <button class="nav-button right" onclick="nextImage()">&#10095;</button>
  </div>

  <div class="thumbnail-strip" id="thumbnails">
    <!-- Thumbnails will be generated here -->
  </div>
</div>

<script>
  const images = [
    'images/IMG_5391.PNG',
    'images/image3.jpg',
    'images/image4.jpg',
    'images/image5.jpg',
    'images/image6.jpg',
    'images/image7.jpg',
    'images/image8.jpg'
  ];

  let currentIndex = 0;
  const mainImage = document.getElementById('mainImage');
  const thumbnailsContainer = document.getElementById('thumbnails');

  function updateMainImage(index) {
    currentIndex = index;
    mainImage.src = images[index];

    document.querySelectorAll('.thumbnail-strip img').forEach((thumb, idx) => {
      thumb.classList.toggle('active', idx === currentIndex);
    });
  }

  function prevImage() {
    if (currentIndex > 0) {
      updateMainImage(currentIndex - 1);
    }
  }

  function nextImage() {
    if (currentIndex < images.length - 1) {
      updateMainImage(currentIndex + 1);
    }
  }

  // Create thumbnail elements
  images.forEach((src, index) => {
    const img = document.createElement('img');
    img.src = src;
    img.alt = `Thumbnail ${index + 1}`;
    img.onclick = () => updateMainImage(index);
    if (index === 0) img.classList.add('active');
    thumbnailsContainer.appendChild(img);
  });

  updateMainImage(currentIndex);
</script>

</body>
</html>
